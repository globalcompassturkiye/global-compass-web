    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<body class="sayfa-ornek">
    <div class="sabit-ust-alan">
        <div class="ust-serit">

                        <li><a href="/iletisim/">Iletisim</a></li>
                    </ul>
                </nav>
            </div>
        </div>

        <header class="ust-menu">
            <div class="ust-alan">
                <div></div>
                <div class="logo">
                    <a href="/">
                        <img src="/img/global-compass-logo.webp" alt="Global Compass Logo" width="158" height="48" fetchpriority="high" decoding="async">
                    </a>
                </div>
                <div class="sosyal-medya-alani">
                    <a href="https://www.instagram.com/globalcompass.turkiye/" target="_blank" rel="noopener noreferrer">
                        <img src="/img/sosyal/instagram.webp" alt="Instagram" width="30" height="30" loading="lazy" decoding="async">
                    </a>
                </div>
            </div>

            <button type="button" class="nav-toggle" aria-label="Menuyu ac/kapat" aria-expanded="false" aria-controls="nav-menu">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>

            <nav class="navigasyon" id="nav-menu" aria-label="Ana menu">
                <ul class="nav-list">
                    <li class="nav-logo-item"><a href="/"><img src="/img/global-compass-logo.webp" alt="Global Compass Logo" width="158" height="48" decoding="async"></a></li>
                    <li><a href="/">Ana Sayfa</a></li>
                    <li><a href="/ornek/" class="aktif">Ornek</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <main id="icerik">
        <article class="icerik-alani">
            <section class="cerceve-kutu icerik-kutusu">
                <section class="navigasyon-kontrol-alani">
                    <h2 class="metin-h2">Yurt Dışı Eğitim Navigasyon</h2>
                    <form id="ornek-acilir-menu-form" class="navigasyon-form-alani">
                        <div class="form-satir">
                            <div>
                                <label for="ornek-kategori">Kategori</label>
                                <select id="ornek-kategori" name="kategori">
                                    <option value="">Kategori secin</option>
                                </select>
                            </div>
                            <div>
                                <label for="ornek-ulke">Ulke</label>
                                <select id="ornek-ulke" name="ulke" disabled>
                                    <option value="">Once kategori secin</option>
                                </select>
                            </div>
                            <div id="ornek-sehir-satiri">
                                <label for="ornek-sehir">Sehir</label>
                                <select id="ornek-sehir" name="sehir" disabled>
                                    <option value="">Once ulke secin</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </section>

                <section id="ornek-okul-listesi-karti" class="navigasyon-okul-listesi-alani" hidden>
                    <p id="ornek-secim-ozeti" class="metin-h2"></p>
                    <div class="rozet-grid icerik-kutusu-grid yatay-1">
                        <div class="rozet-kart">
                            <section id="ornek-okul-listesi" class="modern-okul-listesi"></section>
                        </div>
                    </div>
                </section>
            </section>

            </div>
            <div class="footer-merkezi-icerik">
                <p class="footer-adres-metni">Kizilay mah. Elgun sok. Tugac Ishani 3.Kat No:11 Cankaya / ANKARA</p>
                <div class="footer-iletisim-satiri">
                    <a href="tel:+905353977399" class="footer-link-sade">0535 397 73 99</a>
                    <span class="footer-ayrac">|</span>
                    <a href="mailto:info@globalcompass.com.tr" class="footer-link-sade">info@globalcompass.com.tr</a>
                </div>
            </div>
